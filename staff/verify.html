<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify · Tidepool</title><link rel="stylesheet" href="hr.css"></head><body class="authpage">
<div class="authbox"><div class="logo big"><i></i>tidepool</div><h1>Check your phone</h1><p>We texted a 6-digit code to the number ending in 4417.</p>
<form id="f"><label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
<button type="submit">Verify</button><div class="err" id="err"></div></form></div><div class="foot">Tidepool · Demo site for illustration</div>
<script>
if(sessionStorage.getItem('jl_step')!=='code') location.href='index.html';
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const c=document.getElementById('code').value.trim();
if(/^\d{6}$/.test(c)){sessionStorage.setItem('jl_step','in');location.href='home.html';}else document.getElementById('err').textContent='Enter the 6-digit code.';});</script></body></html>
