<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify · Halcyon Air</title><link rel="stylesheet" href="site.css"></head><body><div class="authbox"><a class="logo" style="margin-bottom:22px;display:flex"><i></i>Halcyon Air</a><h1>Enter your code</h1><p>We texted a 6-digit code to the number ending in 4417.</p>
<form id="f"><label for="code">Verification code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button type="submit">Verify</button><div class="err" id="err"></div></form></div>
<div class="foot">Halcyon Air · Demo site for illustration</div><script>if(sessionStorage.getItem('halcyon_step')!=='code')location.href='index.html';
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(/^\d{6}$/.test(document.getElementById('code').value.trim())){sessionStorage.setItem('halcyon_step','in');location.href='list.html';}else document.getElementById('err').textContent='Enter the 6-digit code.';});</script></body></html>
